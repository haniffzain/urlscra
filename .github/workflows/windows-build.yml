name: Windows Build

on:
  push:
    branches:
      - m1-windows-scraper
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore URLScra.csproj

      - name: Build Release
        run: dotnet build URLScra.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish URLScra.csproj --configuration Release --runtime win-x64 --self-contained false --output publish/win-x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: URLScra-win-x64
          path: publish/win-x64
          if-no-files-found: error
